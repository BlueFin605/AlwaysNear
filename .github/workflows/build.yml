name: build

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  frontend:
    name: Angular build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect Angular project
        id: detect
        run: |
          if [ -f src/frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Frontend not yet scaffolded — skipping."
          fi

      - name: Install + build
        if: steps.detect.outputs.present == 'true'
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

  backend:
    name: TS backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect backend project
        id: detect
        run: |
          if [ -f src/backend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Backend not yet scaffolded — skipping."
          fi

      - name: Install + build
        if: steps.detect.outputs.present == 'true'
        working-directory: src/backend
        run: |
          npm ci
          npm run build
